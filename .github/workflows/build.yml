name: Build Python/Ilus to APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Java (JDK) quraşdır
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK quraşdır
        uses: android-actions/setup-android@v3

      - name: Test faylını yoxla
        run: |
          echo "Test faylı yoxlanılır: paint_term.py"
          python3 paint_term.py --help || echo "Fayl mövcuddur."

      - name: APK yarat (Build)
        run: |
          echo "APK yığımı üçün hazırlıq..."
          # Burada əgər Buildozer və ya xüsusi Android şablonu istifadə edirsinizsə, həmin əmrlər yazılacaq.
          
      - name: APK faylını saxla (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: paint-term-apk
          path: |
            **/*.apk
