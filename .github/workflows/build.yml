name: Ilus APK Auto Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı endir
        uses: actions/checkout@v4

      - name: Python mühitini quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: GUI və Qt üçün Linux Sistem Kitabxanalarını Quraşdır
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-glx \
            libxcb-xinerama0 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libglib2.0-0

      - name: Python Kitabxanalarını Yüklə
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests termcolor PySide6
          fi

      - name: Ilus İnterpreterini işə sal
        run: |
          python3 ilus_pyside.py

      - name: Yaradılmış APK faylını saxla (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ilus-app-apk
          path: |
            *.apk
            **/*.apk
          if-no-files-found: warn
