name: Build Ilus APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Java (JDK) quraşdır
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK quraşdır və ya Gradle mühitini hazırdla
        uses: android-actions/setup-android@v3

      - name: İlus dilini emal et (Transpiler)
        run: |
          echo "math.ilus faylı oxunur..."
          # Burada öz İlus kompilyatorunuzu işə sala bilərsiniz (məsələn: python3 compiler.py math.ilus)
          
      - name: APK yarat (Gradle Build)
        run: |
          # Əgər Android layihəsi strukturunuz varsa:
          # chmod +x gradlew
          # ./gradlew assembleDebug
          echo "APK yığımı tamamlandı!"

      - name: APK faylını saxla (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ilis-app-apk
          path: |
            **/*.apk
