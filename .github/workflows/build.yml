name: Build Ilus to APK with Requests

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lazımi kitabxanaları quraşdır (requests)
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python skriptini işə sal (requests və token ilə)
        env:
          MY_API_TOKEN: ${{ secrets.MY_API_TOKEN }}
        run: |
          python3 paint_term.py

      - name: APK faylını saxla (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ilis-apk-result
          path: |
            *.apk
            **/*.apk
