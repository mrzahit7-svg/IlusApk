name: Universal APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      file_name:
        description: 'Çevriləcək faylın adı (məs: paint_term.py və ya math.ilus)'
        required: true
        default: 'paint_term.py'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı yüklə
        uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Lazımi kitabxanaları quraşdır
        run: |
          pip install requests

      - name: Seçilmiş faylı işə sal və emal et
        env:
          MY_API_TOKEN: ${{ secrets.MY_API_TOKEN }}
          TARGET_FILE: ${{ github.event.inputs.file_name }}
        run: |
          # Əgər birbaşa push edilibsə və input yoxdursa, default olaraq paint_term.py götürür
          FILE_TO_RUN="${TARGET_FILE:-paint_term.py}"
          
          echo "İşə salınan fayl: $FILE_TO_RUN"
          
          if [ -f "$FILE_TO_RUN" ]; then
            python3 "$FILE_TO_RUN"
          else
            echo "XƏTA: $FILE_TO_RUN faylı tapılmadı!"
            exit 1
          fi

      - name: APK faylını saxla (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: generated-apk
          path: |
            *.apk
            **/*.apk
