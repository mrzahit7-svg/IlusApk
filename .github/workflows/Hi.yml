name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            unzip \
            zip

      - name: Find Ilus interpreter
        shell: bash
        run: |
          set -e

          echo "=== Searching for main.py ==="

          MAIN_PY=$(find . \
            -type f \
            -name "main.py" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$MAIN_PY" ]; then
            echo "ERROR: main.py was not found."
            exit 1
          fi

          echo "Found main.py:"
          echo "$MAIN_PY"

          echo "MAIN_PY=$MAIN_PY" >> "$GITHUB_ENV"

      - name: Find Ilus program
        shell: bash
        run: |
          set -e

          echo "=== Searching for .ilus files ==="

          ILUS_COUNT=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./.git/*" \
            | wc -l)

          if [ "$ILUS_COUNT" -eq 0 ]; then
            echo "ERROR: No .ilus file found."
            exit 1
          fi

          if [ "$ILUS_COUNT" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            find . \
              -type f \
              -name "*.ilus" \
              -not -path "./.git/*"
            exit 1
          fi

          ILUS_FILE=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./.git/*" \
            | head -n 1)

          echo "Found Ilus program:"
          echo "$ILUS_FILE"

          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"

      - name: Prepare Ilus project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          cp "$MAIN_PY" build_project/main.py
          cp "$ILUS_FILE" build_project/

          echo "=== Initial project ==="
          find build_project -maxdepth 1 -type f -print

      - name: Collect Ilus imports
        shell: bash
        run: |
          set -e

          echo "=== Reading Ilus imports ==="

          while IFS= read -r line; do

            if echo "$line" | grep -Eq \
              '^[[:space:]]*import[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*$'
            then

              MODULE=$(echo "$line" | sed -E \
                's/^[[:space:]]*import[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*$/\1/')

              echo "Import found: $MODULE"

              FOUND=""

              if [ -f "$MODULE.py" ]; then
                FOUND="$MODULE.py"

              elif [ -f "$MODULE.ilus" ]; then
                FOUND="$MODULE.ilus"

              else
                FOUND=$(find . \
                  -type f \
                  \( -name "$MODULE.py" -o -name "$MODULE.ilus" \) \
                  -not -path "./.git/*" \
                  | head -n 1)
              fi

              if [ -z "$FOUND" ]; then
                echo "WARNING: Library not found: $MODULE"
              else
                echo "Copying library:"
                echo "$FOUND"

                cp "$FOUND" build_project/
              fi

            fi

          done < "$ILUS_FILE"

          echo
          echo "=== Final Ilus project ==="

          find build_project \
            -maxdepth 1 \
            -type f \
            -print

      - name: Install PySide6
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2.1"

          python -m pip install \
            GitPython \
            packaging

      - name: Get PySide Android deployment tools
        shell: bash
        run: |
          set -e

          rm -rf pyside-setup

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup.git

          echo "=== Installing PySide setup requirements ==="

          python -m pip install \
            -r pyside-setup/requirements.txt

          python -m pip install \
            -r pyside-setup/tools/cross_compile_android/requirements.txt

      - name: Download Android SDK and NDK
        shell: bash
        run: |
          set -e

          python \
            pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Download Android PySide6 wheels
        shell: bash
        run: |
          set -e

          rm -rf android_wheels
          mkdir -p android_wheels

          echo "=== Looking for qtpip ==="

          QTPIP=$(find "$pythonLocation" \
            -type f \
            -name "qtpip" \
            2>/dev/null \
            | head -n 1)

          if [ -n "$QTPIP" ]; then

            echo "qtpip executable found:"
            echo "$QTPIP"

            chmod +x "$QTPIP"

            "$QTPIP" download \
              PySide6 \
              --android \
              --arch aarch64 \
              --dest android_wheels

          else

            echo "qtpip executable not found."

            echo "Checking installed PySide6 tools..."

            find "$pythonLocation" \
              -type f \
              \( \
                -iname "*qtpip*" \
                -o \
                -iname "*android*deploy*" \
              \) \
              2>/dev/null \
              | head -n 100

            echo
            echo "Trying PySide6 Android wheel download through pip..."

            python -m pip download \
              PySide6 \
              --only-binary=:all: \
              --dest android_wheels \
              || true

          fi

          echo
          echo "=== Android wheels ==="

          find android_wheels \
            -type f \
            -name "*.whl" \
            -print

      - name: Verify Android wheels
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL=$(find "$GITHUB_WORKSPACE/android_wheels" \
            -type f \
            -name "PySide6-android-aarch64.whl" \
            | head -n 1)

          SHIBOKEN_WHEEL=$(find "$GITHUB_WORKSPACE/android_wheels" \
            -type f \
            -name "shiboken6-android-aarch64.whl" \
            | head -n 1)

          if [ -z "$PYSIDE_WHEEL" ]; then
            echo "ERROR: PySide6 Android wheel was not found."
            exit 1
          fi

          if [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Shiboken6 Android wheel was not found."
            exit 1
          fi

          echo "PySide6:"
          echo "$PYSIDE_WHEEL"

          echo
          echo "Shiboken6:"
          echo "$SHIBOKEN_WHEEL"

          echo "PYSIDE_WHEEL=$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"

      - name: Check Android deploy tool
        shell: bash
        run: |
          set -e

          echo "=== pyside6-android-deploy ==="

          which pyside6-android-deploy

          pyside6-android-deploy --help

      - name: Build APK
        shell: bash
        run: |
          set -e

          echo "=== Build project ==="

          find "$GITHUB_WORKSPACE/build_project" \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "=== PySide6 Android wheel ==="
          echo "$PYSIDE_WHEEL"

          echo
          echo "=== Shiboken6 Android wheel ==="
          echo "$SHIBOKEN_WHEEL"

          echo
          echo "=== Starting Android deployment ==="

          cd "$GITHUB_WORKSPACE/build_project"

          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --force \
            --verbose

      - name: Search for APK
        shell: bash
        run: |
          set -e

          echo "=== Searching entire workspace for APK ==="

          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo
            echo "ERROR: APK was not generated."

            echo
            echo "=== Build project files ==="

            find "$GITHUB_WORKSPACE/build_project" \
              -maxdepth 6 \
              -type f \
              -print \
              | head -n 500

            exit 1
          fi

          echo
          echo "APK found:"
          echo "$APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/Ilus.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: Ilus.apk
