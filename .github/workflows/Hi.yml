name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PySide6 tools
        run: |
          python -m pip install --upgrade pip
          pip install PySide6==6.8.2.1
          pip install shiboken6==6.8.2.1

      # --------------------------------------------------
      # Find all imports from the main .ilus file
      # --------------------------------------------------
      - name: Collect Ilus imports
        shell: python
        run: |
          import re
          import shutil
          from pathlib import Path

          root = Path(".")
          bundle = root / "ilus_bundle"
          bundle.mkdir(exist_ok=True)

          main = root / "main.ilus"

          if not main.exists():
              raise SystemExit("ERROR: main.ilus was not found!")

          # Main Ilus program
          shutil.copy2(main, bundle / main.name)

          text = main.read_text(encoding="utf-8")

          imports = re.findall(
              r'^\s*import\s+([A-Za-z_][A-Za-z0-9_]*)',
              text,
              re.MULTILINE
          )

          print("Found imports:")
          for name in imports:
              print(" -", name)

          copied = set()

          for name in imports:
              candidates = [
                  root / f"{name}.py",
                  root / f"{name}.ilus",
              ]

              found = False

              for source in candidates:
                  if source.exists():
                      destination = bundle / source.name
                      shutil.copy2(source, destination)
                      copied.add(source.name)
                      print("Copied:", source)
                      found = True
                      break

              if not found:
                  raise SystemExit(
                      f"ERROR: Imported module '{name}' "
                      f"was not found as {name}.py or {name}.ilus"
                  )

          print("\nCollected libraries:")
          for item in sorted(copied):
              print(" -", item)

      # --------------------------------------------------
      # Copy interpreter
      # --------------------------------------------------
      - name: Prepare interpreter
        run: |
          cp ilus_pyside.py ilus_bundle/

      # --------------------------------------------------
      # Show final bundle
      # --------------------------------------------------
      - name: Show bundle
        run: |
          echo "===== ILUS BUNDLE ====="
          find ilus_bundle -maxdepth 1 -type f -print
          echo "======================="

      # --------------------------------------------------
      # Build Android APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          cd ilus_bundle

          pyside6-android-deploy \
            --name Ilus \
            --wheel-pyside "$(python -c 'import glob; print(glob.glob("../**/PySide6*.whl", recursive=True)[0])')" \
            --wheel-shiboken "$(python -c 'import glob; print(glob.glob("../**/shiboken6*.whl", recursive=True)[0])')" \
            --force

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: "**/*.apk"
          if-no-files-found: error
