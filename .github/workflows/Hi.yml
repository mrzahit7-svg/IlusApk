name: Build Ilus APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ilus_file:
        description: "APK-ya çevriləcək .ilus faylı"
        default: "math.ilus"
        required: true
      app_name:
        description: "Tətbiqin adı"
        default: "IlusApp"
        required: true

env:
  ILUS_FILE: ${{ github.event.inputs.ilus_file || 'math.ilus' }}
  APP_NAME: ${{ github.event.inputs.app_name || 'IlusApp' }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Repo-nu yüklə
        uses: actions/checkout@v4

      - name: Python qur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17 qur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sistem paketlərini quraşdır
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            libltdl-dev build-essential

      - name: Buildozer quraşdır
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython<3.1" setuptools

      - name: Ilus mühərrikini GUI-dən ayır
        run: |
          # main.py = PySide6 IDE + dil mühərriki. Android-də PySide6 yoxdur,
          # ona görə yalnız təmiz Python mühərrikini (IlusInterpreter) götürürük.
          test -f main.py || { echo "main.py tapılmadı"; exit 1; }
          test -f "$ILUS_FILE" || { echo "$ILUS_FILE tapılmadı"; exit 1; }
          mkdir -p build_apk
          python - <<'PYEOF'
          src = open("main.py", encoding="utf-8").read()
          marker = "# Ilus IDE - PySide6 GUI shell"
          m = src.index(marker)
          cut = src.rfind("# ====", 0, m)
          engine = src[:cut]
          assert "class IlusInterpreter" in engine, "IlusInterpreter tapılmadı"
          open("build_apk/ilus_engine.py", "w", encoding="utf-8").write(engine)
          print("Mühərrik sətirləri:", len(engine.splitlines()))
          PYEOF
          python -m py_compile build_apk/ilus_engine.py
          cp "$ILUS_FILE" build_apk/program.ilus

      - name: Android tətbiq faylını (Kivy) yarat
        run: |
          cat > build_apk/main.py <<'PYEOF'
          import os
          import threading

          from kivy.app import App
          from kivy.clock import Clock
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.label import Label
          from kivy.uix.scrollview import ScrollView
          from kivy.uix.textinput import TextInput

          HERE = os.path.dirname(os.path.abspath(__file__))


          class IlusApp(App):
              def build(self):
                  self.title = "Ilus"
                  root = BoxLayout(orientation="vertical", padding=6, spacing=6)

                  self.scroll = ScrollView()
                  self.out = Label(
                      text="", size_hint_y=None, halign="left", valign="top",
                      markup=False,
                  )
                  self.out.bind(
                      width=lambda *a: setattr(self.out, "text_size", (self.out.width, None)),
                      texture_size=lambda *a: setattr(self.out, "height", self.out.texture_size[1]),
                  )
                  self.scroll.add_widget(self.out)
                  root.add_widget(self.scroll)

                  self.input = TextInput(
                      multiline=False, size_hint_y=None, height=110,
                      disabled=True, hint_text="",
                  )
                  self.input.bind(on_text_validate=self._on_submit)
                  root.add_widget(self.input)

                  self._input_event = threading.Event()
                  self._input_value = ""
                  self._last_count = 0
                  self.interp = None
                  return root

              def on_start(self):
                  try:
                      os.chdir(self.user_data_dir)
                  except Exception:
                      pass
                  from ilus_engine import IlusInterpreter
                  with open(os.path.join(HERE, "program.ilus"), encoding="utf-8") as f:
                      code = f.read()
                  self.interp = IlusInterpreter(request_input_callback=self._request_input)
                  threading.Thread(target=self._run, args=(code,), daemon=True).start()
                  Clock.schedule_interval(self._poll, 0.1)

              def _run(self, code):
                  try:
                      result = self.interp.run(code)
                      if result and str(result) not in "\n".join(self.interp.logs):
                          self.interp.logs.append(str(result))
                  except Exception as e:
                      self.interp.logs.append("Xəta: %s" % e)

              def _poll(self, dt):
                  logs = list(self.interp.logs)
                  if len(logs) < self._last_count:
                      self.out.text = ""
                      self._last_count = 0
                  new = logs[self._last_count:]
                  if new:
                      self.out.text += ("\n" if self.out.text else "") + "\n".join(new)
                      self._last_count = len(logs)
                      Clock.schedule_once(lambda d: setattr(self.scroll, "scroll_y", 0), 0.05)

              # Ilus-un input/free() sorğusu interpreter thread-indən gəlir
              def _request_input(self, prompt):
                  self._input_event = threading.Event()
                  self._input_value = ""
                  Clock.schedule_once(lambda dt: self._enable_input(prompt))
                  self._input_event.wait()
                  return self._input_value

              def _enable_input(self, prompt):
                  self.input.hint_text = str(prompt or "")
                  self.input.text = ""
                  self.input.disabled = False
                  self.input.focus = True

              def _on_submit(self, instance):
                  self._input_value = instance.text
                  instance.disabled = True
                  instance.text = ""
                  self._input_event.set()


          if __name__ == "__main__":
              IlusApp().run()
          PYEOF

      - name: buildozer.spec yarat
        run: |
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          [ -z "$PKG" ] && PKG="ilusapp"
          cat > build_apk/buildozer.spec <<EOF
          [app]
          title = ${APP_NAME}
          package.name = ${PKG}
          package.domain = org.ilus
          source.dir = .
          source.include_exts = py,ilus
          version = 1.0
          requirements = python3,kivy==2.3.0
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.api = 33
          android.minapi = 21
          android.permissions = INTERNET
          android.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF
          cat build_apk/buildozer.spec

      - name: Buildozer keşi
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            build_apk/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('.github/workflows/build-apk.yml') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: APK-nı build et
        working-directory: build_apk
        run: buildozer -v android debug

      - name: APK-nı yüklə (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ilus-apk
          path: build_apk/bin/*.apk
          if-no-files-found: error
