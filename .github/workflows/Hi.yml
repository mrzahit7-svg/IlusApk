name: Ilus Auto APK Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyanı endir
        uses: actions/checkout@v4

      - name: Python mühitini quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Java JDK quraşdır
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Asılılıqlarını və Buildozer-i Quraşdır
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git ffmpeg libsdl2-dev libportmidi-dev \
            libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev ccache autoconf \
            libtool pkg-config libncurses5-dev libncursesw5-dev libffi-dev zip unzip
          pip install --upgrade pip
          pip install buildozer cython

      - name: buildozer.spec Faylını Avtomatik Yarat
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Ilus App
          package.name = ilusapp
          package.domain = org.ilus
          source.dir = .
          source.include_exts = py,ilus
          main.filename = ilus_pyside.py
          version = 1.0
          requirements = python3,pyside6
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.accept_sdk_license = True
          p4a.accept_sdk_license = True

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: APK-nı Build Et
        run: |
          yes | buildozer android debug

      - name: Hazır APK-nı Yüklə (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ilus-app-apk
          path: bin/*.apk
          if-no-files-found: error
