name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Show repository
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort


      - name: Find main.py
        shell: bash
        run: |
          set -e

          MAIN=$(find . -type f -name "main.py" | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.py was not found!"
            exit 1
          fi

          echo "Found main.py: $MAIN"
          echo "MAIN_PY=$MAIN" >> "$GITHUB_ENV"


      - name: Find Ilus program
        shell: bash
        run: |
          set -e

          FILES=$(find . -type f -name "*.ilus")

          COUNT=$(echo "$FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .ilus file found!"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            echo "$FILES"
            exit 1
          fi

          ILUS_FILE=$(echo "$FILES" | head -n 1)

          echo "Found Ilus program: $ILUS_FILE"
          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"


      - name: Prepare Ilus project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          cp "$MAIN_PY" build_project/main.py
          cp "$ILUS_FILE" build_project/

          echo "=== Build project ==="
          find build_project -type f -print


      - name: Collect Ilus imports
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          project = Path("build_project")

          main_file = project / Path("${{ env.ILUS_FILE }}").name

          if not main_file.exists():
              raise SystemExit(
                  f"ERROR: Main Ilus file not found: {main_file}"
              )

          text = main_file.read_text(encoding="utf-8")

          pattern = re.compile(
              r'^\s*import\s+([A-Za-z_][A-Za-z0-9_]*)\s*$',
              re.MULTILINE
          )

          imports = pattern.findall(text)

          print("=== Ilus imports ===")

          if not imports:
              print("No imports found.")

          for name in imports:

              py_file = Path(name + ".py")
              ilus_file = Path(name + ".ilus")

              if py_file.exists():
                  shutil.copy2(
                      py_file,
                      project / py_file.name
                  )
                  print(f"Included: {py_file.name}")

              elif ilus_file.exists():
                  shutil.copy2(
                      ilus_file,
                      project / ilus_file.name
                  )
                  print(f"Included: {ilus_file.name}")

              else:
                  raise SystemExit(
                      f"ERROR: import '{name}' found, "
                      f"but {name}.py or {name}.ilus was not found!"
                  )


      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            openjdk-17-jdk \
            build-essential


      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2.1" \
            GitPython


      - name: Check PySide6 deployment tool
        run: |
          echo "=== PySide6 ==="
          python -c "import PySide6; print(PySide6.__version__)"

          echo "=== Deployment command ==="
          which pyside6-android-deploy || true

          pyside6-android-deploy --help


      - name: Prepare Android environment
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup.git

          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license


      - name: Download Android PySide6 wheels
        working-directory: build_project
        run: |
          set -e

          mkdir -p wheels

          qtpip download PySide6 \
            --android \
            --arch aarch64 \
            --dest wheels

          echo "=== Android wheels ==="
          find wheels -type f -print


      - name: Find Android wheels
        working-directory: build_project
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL=$(find wheels \
            -type f \
            -name "PySide6-*.whl" \
            | head -n 1)

          SHIBOKEN_WHEEL=$(find wheels \
            -type f \
            -name "shiboken6-*.whl" \
            | head -n 1)

          if [ -z "$PYSIDE_WHEEL" ]; then
            echo "ERROR: PySide6 Android wheel not found!"
            exit 1
          fi

          if [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Shiboken6 Android wheel not found!"
            exit 1
          fi

          echo "PySide6 wheel:"
          echo "$PYSIDE_WHEEL"

          echo "Shiboken6 wheel:"
          echo "$SHIBOKEN_WHEEL"

          echo "PYSIDE_WHEEL=$PWD/$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$PWD/$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"


      - name: Build APK
        working-directory: build_project
        run: |
          set -e

          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --arch aarch64 \
            --force


      - name: Find APK
        shell: bash
        run: |
          echo "=== APK files ==="

          find build_project \
            -type f \
            -name "*.apk" \
            -print


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: |
            build_project/**/*.apk
            build_project/*.apk
          if-no-files-found: error
