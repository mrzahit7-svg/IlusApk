name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724

    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Check Android tools already installed on runner
      # --------------------------------------------------

      - name: Check Android environment
        shell: bash
        run: |
          set -e

          echo "=== Android SDK ==="
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "=== NDK ==="
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "=== SDK manager ==="
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

          echo
          echo "=== NDK directory ==="
          test -d "$ANDROID_NDK_ROOT"
          ls -la "$ANDROID_NDK_ROOT" | head

          echo
          echo "=== Disk ==="
          df -h

      # --------------------------------------------------
      # 4. System dependencies
      # --------------------------------------------------

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            unzip \
            zip \
            openjdk-17-jdk

      # --------------------------------------------------
      # 5. Find Ilus interpreter
      # --------------------------------------------------

      - name: Find main.py
        shell: bash
        run: |
          set -e

          MAIN_PY=$(find . \
            -type f \
            -name "main.py" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$MAIN_PY" ]; then
            echo "ERROR: main.py not found."
            exit 1
          fi

          echo "MAIN_PY=$MAIN_PY" >> "$GITHUB_ENV"

          echo "Found main.py:"
          echo "$MAIN_PY"

      # --------------------------------------------------
      # 6. Find Ilus program
      # --------------------------------------------------

      - name: Find Ilus program
        shell: bash
        run: |
          set -e

          mapfile -t FILES < <(
            find . \
              -type f \
              -name "*.ilus" \
              -not -path "./.git/*"
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "ERROR: No .ilus file found."
            exit 1
          fi

          if [ "${#FILES[@]}" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            printf '%s\n' "${FILES[@]}"
            exit 1
          fi

          ILUS_FILE="${FILES[0]}"

          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"

          echo "Found Ilus program:"
          echo "$ILUS_FILE"

      # --------------------------------------------------
      # 7. Prepare project
      # --------------------------------------------------

      - name: Prepare Ilus project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          cp "$MAIN_PY" build_project/main.py
          cp "$ILUS_FILE" build_project/

          echo "=== Initial project ==="
          find build_project -maxdepth 1 -type f -print

      # --------------------------------------------------
      # 8. Copy Ilus imports
      # --------------------------------------------------

      - name: Collect Ilus imports
        shell: bash
        run: |
          set -e

          echo "=== Imports ==="

          while IFS= read -r line; do

            if echo "$line" | grep -Eq \
              '^[[:space:]]*import[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*$'
            then

              MODULE=$(echo "$line" | sed -E \
                's/^[[:space:]]*import[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*$/\1/')

              echo "Found import: $MODULE"

              FOUND=""

              if [ -f "$MODULE.py" ]; then
                FOUND="$MODULE.py"
              elif [ -f "$MODULE.ilus" ]; then
                FOUND="$MODULE.ilus"
              else
                FOUND=$(find . \
                  -type f \
                  \( -name "$MODULE.py" -o -name "$MODULE.ilus" \) \
                  -not -path "./.git/*" \
                  | head -n 1)
              fi

              if [ -z "$FOUND" ]; then
                echo "WARNING: Library '$MODULE' was not found."
              else
                echo "Copying $FOUND"
                cp "$FOUND" build_project/
              fi

            fi

          done < "$ILUS_FILE"

          echo
          echo "=== Final Ilus project ==="
          find build_project -maxdepth 1 -type f -print

      # --------------------------------------------------
      # 9. Install desktop PySide6 deployment tool
      # --------------------------------------------------

      - name: Install PySide6
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2.1"

          python -m pip install \
            GitPython \
            packaging

      # --------------------------------------------------
      # 10. Verify deploy tool
      # --------------------------------------------------

      - name: Verify Android deploy tool
        shell: bash
        run: |
          set -e

          echo "=== pyside6-android-deploy ==="

          command -v pyside6-android-deploy

          pyside6-android-deploy --help

      # --------------------------------------------------
      # 11. Download OFFICIAL prebuilt Android wheels
      # --------------------------------------------------

      - name: Download official Android wheels
        shell: bash
        run: |
          set -e

          mkdir -p android_wheels

          PY_URL="https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          SHIBOKEN_URL="https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo "Downloading PySide6 Android wheel..."
          curl -fL \
            "$PY_URL" \
            -o android_wheels/PySide6-android-aarch64.whl

          echo "Downloading Shiboken6 Android wheel..."
          curl -fL \
            "$SHIBOKEN_URL" \
            -o android_wheels/shiboken6-android-aarch64.whl

          echo
          echo "=== Wheels ==="
          ls -lh android_wheels

      # --------------------------------------------------
      # 12. Verify wheels
      # --------------------------------------------------

      - name: Verify Android wheels
        shell: bash
        run: |
          set -e

          test -s android_wheels/PySide6-android-aarch64.whl
          test -s android_wheels/shiboken6-android-aarch64.whl

          echo "PySide6 wheel:"
          unzip -l android_wheels/PySide6-android-aarch64.whl \
            | head -n 20

          echo
          echo "Shiboken6 wheel:"
          unzip -l android_wheels/shiboken6-android-aarch64.whl \
            | head -n 20

      # --------------------------------------------------
      # 13. Build APK
      # --------------------------------------------------

      - name: Build Ilus APK
        shell: bash
        working-directory: build_project
        run: |
          set -e

          echo "=== Project ==="
          ls -lah

          echo
          echo "=== Android SDK ==="
          echo "$ANDROID_SDK_ROOT"

          echo
          echo "=== Android NDK ==="
          echo "$ANDROID_NDK_ROOT"

          echo
          echo "=== Starting deployment ==="

          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside="$GITHUB_WORKSPACE/android_wheels/PySide6-android-aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android_wheels/shiboken6-android-aarch64.whl" \
            --ndk-path="$ANDROID_NDK_ROOT" \
            --sdk-path="$ANDROID_SDK_ROOT" \
            --force \
            --verbose

      # --------------------------------------------------
      # 14. Find APK
      # --------------------------------------------------

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          APK=$(find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "=== Files ==="
            find . \
              -type f \
              -not -path "./.git/*" \
              | tail -n 100

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Ilus.apk"

      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------

      - name: Upload Ilus APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: Ilus.apk
          if-no-files-found: error
