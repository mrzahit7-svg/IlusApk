name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            unzip \
            zip \
            p7zip-full

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            GitPython \
            PySide6==6.8.0 \
            packaging

      - name: Find Ilus files
        shell: bash
        run: |
          set -e

          MAIN_PY=$(find . \
            -type f \
            -name "main.py" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$MAIN_PY" ]; then
            echo "ERROR: main.py not found"
            exit 1
          fi

          ILUS_COUNT=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./.git/*" \
            | wc -l)

          if [ "$ILUS_COUNT" -eq 0 ]; then
            echo "ERROR: No .ilus file found"
            exit 1
          fi

          if [ "$ILUS_COUNT" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            find . -type f -name "*.ilus" -not -path "./.git/*"
            exit 1
          fi

          ILUS_FILE=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./.git/*" \
            | head -n 1)

          echo "MAIN_PY=$MAIN_PY" >> "$GITHUB_ENV"
          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"

          echo "main.py: $MAIN_PY"
          echo ".ilus: $ILUS_FILE"

      - name: Prepare Ilus project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir build_project

          cp "$MAIN_PY" build_project/main.py
          cp "$ILUS_FILE" build_project/

          echo "=== Initial project ==="
          find build_project -maxdepth 1 -type f -print

      - name: Copy Ilus imports
        shell: bash
        run: |
          set -e

          echo "=== Checking imports ==="

          while IFS= read -r line; do
            if echo "$line" | grep -Eq '^[[:space:]]*import[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*$'; then

              MODULE=$(echo "$line" | sed -E \
                's/^[[:space:]]*import[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*$/\1/')

              echo "Import: $MODULE"

              FOUND=""

              if [ -f "$MODULE.py" ]; then
                FOUND="$MODULE.py"
              elif [ -f "$MODULE.ilus" ]; then
                FOUND="$MODULE.ilus"
              else
                FOUND=$(find . \
                  -type f \
                  \( -name "$MODULE.py" -o -name "$MODULE.ilus" \) \
                  -not -path "./.git/*" \
                  | head -n 1)
              fi

              if [ -n "$FOUND" ]; then
                echo "Copying $FOUND"
                cp "$FOUND" build_project/
              else
                echo "WARNING: Library '$MODULE' not found"
              fi
            fi
          done < "$ILUS_FILE"

          echo
          echo "=== Final Ilus project ==="
          find build_project -maxdepth 1 -type f -print

      - name: Clone Qt PySide setup
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/pyside-setup"

          git clone \
            --depth 1 \
            https://code.qt.io/pyside/pyside-setup \
            "$HOME/pyside-setup"

      - name: Install PySide Android requirements
        shell: bash
        run: |
          set -e

          python -m pip install \
            -r "$HOME/pyside-setup/requirements.txt"

          python -m pip install \
            -r "$HOME/pyside-setup/tools/cross_compile_android/requirements.txt"

      - name: Download Android SDK and NDK
        shell: bash
        run: |
          set -e

          cd "$HOME/pyside-setup"

          python tools/cross_compile_android/main.py \
            --download-only \
            --auto-accept-license

      - name: Download prebuilt Android wheels
        shell: bash
        run: |
          set -e

          WHEELS="$HOME/.pyside6_android_deploy/wheels"

          mkdir -p "$WHEELS"

          BASE_URL="https://github.com/EchterAlsFake/PySide6-to-Android/releases/download/6.8.0_3.11"

          PYSIDE_WHEEL="PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl"

          echo "Downloading PySide6 Android wheel..."
          curl -L \
            "$BASE_URL/$PYSIDE_WHEEL" \
            -o "$WHEELS/$PYSIDE_WHEEL"

          echo "Downloading Shiboken6 Android wheel..."
          curl -L \
            "$BASE_URL/$SHIBOKEN_WHEEL" \
            -o "$WHEELS/$SHIBOKEN_WHEEL"

          echo
          echo "=== Wheels ==="
          ls -lh "$WHEELS"

          test -s "$WHEELS/$PYSIDE_WHEEL"
          test -s "$WHEELS/$SHIBOKEN_WHEEL"

      - name: Locate Android SDK and NDK
        shell: bash
        run: |
          set -e

          DEPLOY="$HOME/.pyside6_android_deploy"

          SDK="$DEPLOY/android-sdk"
          NDK="$DEPLOY/android-ndk/android-ndk-r27c"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found:"
            echo "$SDK"
            exit 1
          fi

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK not found:"
            echo "$NDK"
            exit 1
          fi

          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "NDK=$NDK" >> "$GITHUB_ENV"

          echo "SDK: $SDK"
          echo "NDK: $NDK"

      - name: Build Ilus APK
        shell: bash
        run: |
          set -e

          WHEELS="$HOME/.pyside6_android_deploy/wheels"

          PYSIDE_WHEEL="$WHEELS/PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl"
          SHIBOKEN_WHEEL="$WHEELS/shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl"

          cd build_project

          echo "=== Building ==="

          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --ndk-path="$NDK" \
            --sdk-path="$SDK" \
            --force \
            --verbose

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          APK=$(find . .. \
            -type f \
            -name "*.apk" \
            2>/dev/null \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Ilus.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: Ilus.apk
