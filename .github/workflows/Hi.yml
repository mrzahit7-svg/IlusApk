name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            wget \
            unzip \
            zip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build

      # ------------------------------------------------------------
      # FIND ILUS FILES
      # ------------------------------------------------------------

      - name: Find Ilus interpreter
        shell: bash
        run: |
          set -e

          MAIN_PY=$(find . \
            -type f \
            -name "main.py" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$MAIN_PY" ]; then
            echo "ERROR: main.py was not found."
            exit 1
          fi

          echo "Found interpreter:"
          echo "$MAIN_PY"

          echo "MAIN_PY=$MAIN_PY" >> "$GITHUB_ENV"

      - name: Find Ilus program
        shell: bash
        run: |
          set -e

          COUNT=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./.git/*" \
            | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .ilus file found."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            find . \
              -type f \
              -name "*.ilus" \
              -not -path "./.git/*"
            exit 1
          fi

          ILUS_FILE=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./.git/*" \
            | head -n 1)

          echo "Found Ilus program:"
          echo "$ILUS_FILE"

          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # PREPARE ILUS PROJECT
      # ------------------------------------------------------------

      - name: Prepare Ilus project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          cp "$MAIN_PY" build_project/main.py
          cp "$ILUS_FILE" build_project/

          echo "=== Initial project ==="
          find build_project -maxdepth 1 -type f -print

      # ------------------------------------------------------------
      # COPY IMPORTED ILUS LIBRARIES
      # ------------------------------------------------------------

      - name: Collect Ilus imports
        shell: bash
        run: |
          set -e

          echo "=== Reading imports from $ILUS_FILE ==="

          while IFS= read -r line; do

            if echo "$line" | grep -Eq \
              '^[[:space:]]*import[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*$'
            then

              MODULE=$(echo "$line" | sed -E \
                's/^[[:space:]]*import[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*$/\1/')

              echo "Import detected: $MODULE"

              FOUND=""

              if [ -f "$MODULE.py" ]; then
                FOUND="$MODULE.py"
              elif [ -f "$MODULE.ilus" ]; then
                FOUND="$MODULE.ilus"
              fi

              if [ -z "$FOUND" ]; then
                FOUND=$(find . \
                  -type f \
                  \( -name "$MODULE.py" -o -name "$MODULE.ilus" \) \
                  -not -path "./.git/*" \
                  | head -n 1)
              fi

              if [ -z "$FOUND" ]; then
                echo "WARNING: Library not found: $MODULE"
              else
                echo "Copying library:"
                echo "$FOUND"

                cp "$FOUND" build_project/
              fi

            fi

          done < "$ILUS_FILE"

          echo
          echo "=== Final Ilus project ==="

          find build_project \
            -maxdepth 1 \
            -type f \
            -print

      # ------------------------------------------------------------
      # PYTHON DEPENDENCIES
      # ------------------------------------------------------------

      - name: Install PySide6 deployment tools
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2.1"

          python -m pip install \
            GitPython \
            packaging

      # ------------------------------------------------------------
      # PY SIDE ANDROID DEPLOYMENT REPOSITORY
      # ------------------------------------------------------------

      - name: Get PySide Android deployment tools
        shell: bash
        run: |
          set -e

          rm -rf pyside-setup

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup.git

          python -m pip install \
            -r pyside-setup/requirements.txt

          python -m pip install \
            -r pyside-setup/tools/cross_compile_android/requirements.txt

      # ------------------------------------------------------------
      # ANDROID SDK + NDK
      # ------------------------------------------------------------

      - name: Download Android SDK and NDK
        shell: bash
        run: |
          set -e

          python \
            pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      # ------------------------------------------------------------
      # DOWNLOAD OFFICIAL ANDROID WHEELS
      # ------------------------------------------------------------

      - name: Download official PySide6 Android wheels
        shell: bash
        run: |
          set -e

          mkdir -p wheels

          BASE="https://download.qt.io/official_releases/QtForPython/pyside6"

          PYSIDE_FILE="PySide6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo "Downloading:"
          echo "$PYSIDE_FILE"

          curl -fL \
            "$BASE/$PYSIDE_FILE" \
            -o "wheels/$PYSIDE_FILE"

          echo
          echo "=== PySide6 wheel ==="
          ls -lh "wheels/$PYSIDE_FILE"

      # ------------------------------------------------------------
      # FIND THE EXACT SHIBOKEN ANDROID WHEEL
      # ------------------------------------------------------------

      - name: Find official Shiboken6 Android wheel
        shell: bash
        run: |
          set -e

          BASE="https://download.qt.io/official_releases/QtForPython/pyside6"

          echo "Downloading official Qt wheel index..."

          curl -fL \
            "$BASE/" \
            -o qt_index.html

          echo
          echo "=== Searching Shiboken6 Android aarch64 wheel ==="

          SHIBOKEN_FILE=$(grep -oE \
            'Shiboken6-[^"]+android_aarch64\.whl' \
            qt_index.html \
            | head -n 1)

          if [ -z "$SHIBOKEN_FILE" ]; then
            echo "ERROR: Official Shiboken6 Android aarch64 wheel was not found."
            echo
            echo "Available Android Shiboken entries:"
            grep -oE \
              'Shiboken6-[^"]+android_[^"]+\.whl' \
              qt_index.html \
              | head -n 50 || true

            exit 1
          fi

          echo "Found:"
          echo "$SHIBOKEN_FILE"

          curl -fL \
            "$BASE/$SHIBOKEN_FILE" \
            -o "wheels/$SHIBOKEN_FILE"

          echo "SHIBOKEN_FILE=$SHIBOKEN_FILE" >> "$GITHUB_ENV"

          echo
          echo "=== Wheels ==="
          ls -lh wheels/

      # ------------------------------------------------------------
      # VERIFY WHEELS
      # ------------------------------------------------------------

      - name: Verify Android wheels
        shell: bash
        run: |
          set -e

          echo "=== Wheels to be used ==="

          find wheels \
            -maxdepth 1 \
            -type f \
            -name "*.whl" \
            -print \
            -exec ls -lh {} \;

          PYSIDE_WHEEL=$(find wheels \
            -type f \
            -name "PySide6-*.whl" \
            -name "*android_aarch64.whl" \
            | head -n 1)

          SHIBOKEN_WHEEL=$(find wheels \
            -type f \
            -name "Shiboken6-*.whl" \
            -name "*android_aarch64.whl" \
            | head -n 1)

          if [ -z "$PYSIDE_WHEEL" ]; then
            echo "ERROR: PySide6 Android wheel missing."
            exit 1
          fi

          if [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Shiboken6 Android wheel missing."
            exit 1
          fi

          echo
          echo "PySide6:"
          echo "$PYSIDE_WHEEL"

          echo
          echo "Shiboken6:"
          echo "$SHIBOKEN_WHEEL"

          echo "PYSIDE_WHEEL=$PWD/$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$PWD/$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # CHECK DEPLOYER
      # ------------------------------------------------------------

      - name: Check Android deploy tool
        shell: bash
        run: |
          set -e

          which pyside6-android-deploy

          pyside6-android-deploy --help

      # ------------------------------------------------------------
      # BUILD APK
      # ------------------------------------------------------------

      - name: Build Ilus APK
        shell: bash
        run: |
          set -e

          echo "=== Project ==="
          find build_project \
            -maxdepth 1 \
            -type f \
            -print

          echo
          echo "=== PySide6 wheel ==="
          echo "$PYSIDE_WHEEL"

          echo
          echo "=== Shiboken6 wheel ==="
          echo "$SHIBOKEN_WHEEL"

          cd build_project

          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --force \
            --verbose

      # ------------------------------------------------------------
      # FIND APK
      # ------------------------------------------------------------

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          APK=$(find . .. \
            -type f \
            -name "*.apk" \
            2>/dev/null \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Ilus.apk"

          ls -lh "$GITHUB_WORKSPACE/Ilus.apk"

      # ------------------------------------------------------------
      # UPLOAD APK
      # ------------------------------------------------------------

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK-arm64-v8a
          path: Ilus.apk
