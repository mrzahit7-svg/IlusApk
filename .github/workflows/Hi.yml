name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # =========================================================
      # 1. GitHub repository-ni götür
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # 2. Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # =========================================================
      # 3. Java
      # =========================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # =========================================================
      # 4. Python paketləri
      # =========================================================
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "PySide6==6.8.2.1"


      # =========================================================
      # 5. Repo-dakı ilk .ilus faylını tap
      # =========================================================
      - name: Find first Ilus file
        shell: bash
        run: |
          set -e

          echo "Searching repository for .ilus files..."

          ILUS_FILE=$(find . \
            -type f \
            -name "*.ilus" \
            ! -path "./.git/*" \
            | sort \
            | head -n 1)

          if [ -z "$ILUS_FILE" ]; then
            echo "::error::No .ilus file was found in the repository."
            exit 1
          fi

          ILUS_FILE="${ILUS_FILE#./}"
          ILUS_NAME="$(basename "$ILUS_FILE")"
          ILUS_DIR="$(dirname "$ILUS_FILE")"

          echo
          echo "========================================"
          echo "Ilus source:"
          echo "$ILUS_FILE"
          echo "Ilus name:"
          echo "$ILUS_NAME"
          echo "========================================"
          echo

          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"
          echo "ILUS_NAME=$ILUS_NAME" >> "$GITHUB_ENV"
          echo "ILUS_DIR=$ILUS_DIR" >> "$GITHUB_ENV"


      # =========================================================
      # 6. Repository-ni yoxla
      # =========================================================
      - name: Show project
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          find . \
            -type f \
            ! -path "./.git/*" \
            | sort

          echo
          echo "=== Selected Ilus file ==="
          echo "$ILUS_FILE"

          echo
          echo "=== Ilus source ==="
          cat "$ILUS_FILE"


      # =========================================================
      # 7. Build project yarat
      # =========================================================
      - name: Prepare Ilus build project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          # Bütün repository-ni build project-ə köçür.
          #
          # Beləliklə:
          #
          #   main.py
          #   *.ilus
          #   *.py
          #   Ilus kitabxanaları
          #
          # hamısı interpreter üçün əlçatan qalır.
          cp -r . build_project

          rm -rf build_project/.git
          rm -rf build_project/.github
          rm -rf build_project/.buildozer
          rm -rf build_project/dist

          echo
          echo "=== Build project ==="
          find build_project \
            -maxdepth 5 \
            -type f \
            | sort


      # =========================================================
      # 8. Ilus import-larını tap
      #
      # Məsələn:
      #
      # import math
      #
      # → math.ilus / math.py / math/__init__.ilus
      #
      # internetdən heç nə götürülmür.
      # =========================================================
      - name: Resolve Ilus imports
        working-directory: build_project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Resolving Ilus imports"
          echo "Source: $ILUS_NAME"
          echo "========================================"

          IMPORT_FILE=".ilus_imports"

          : > "$IMPORT_FILE"

          grep -E \
            '^[[:space:]]*import[[:space:]]+[A-Za-z_][A-Za-z0-9_]*' \
            "$ILUS_FILE" \
            2>/dev/null \
            | sed -E \
              's/^[[:space:]]*import[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*/\1/' \
            >> "$IMPORT_FILE" || true

          grep -E \
            '^[[:space:]]*from[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]+import' \
            "$ILUS_FILE" \
            2>/dev/null \
            | sed -E \
              's/^[[:space:]]*from[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*/\1/' \
            >> "$IMPORT_FILE" || true

          sort -u "$IMPORT_FILE" -o "$IMPORT_FILE"

          echo
          echo "Detected imports:"

          if [ -s "$IMPORT_FILE" ]; then
            cat "$IMPORT_FILE"
          else
            echo "No imports found."
          fi

          echo

          # -----------------------------------------------------
          # Hər import-u repository daxilində axtar
          # -----------------------------------------------------

          while IFS= read -r LIB; do

            [ -z "$LIB" ] && continue

            echo "Checking library: $LIB"

            FOUND=""

            # LIB.ilus
            FOUND=$(find . \
              -type f \
              -name "${LIB}.ilus" \
              ! -path "./.git/*" \
              | head -n 1 || true)

            # LIB.py
            if [ -z "$FOUND" ]; then
              FOUND=$(find . \
                -type f \
                -name "${LIB}.py" \
                ! -path "./.git/*" \
                | head -n 1 || true)
            fi

            # LIB/__init__.ilus
            if [ -z "$FOUND" ]; then
              FOUND=$(find . \
                -type f \
                -path "*/${LIB}/__init__.ilus" \
                ! -path "./.git/*" \
                | head -n 1 || true)
            fi

            # LIB/__init__.py
            if [ -z "$FOUND" ]; then
              FOUND=$(find . \
                -type f \
                -path "*/${LIB}/__init__.py" \
                ! -path "./.git/*" \
                | head -n 1 || true)
            fi

            if [ -z "$FOUND" ]; then
              echo
              echo "::error::Ilus library '$LIB' was not found in the repository."
              echo
              echo "The following files were searched:"
              echo "  ${LIB}.ilus"
              echo "  ${LIB}.py"
              echo "  ${LIB}/__init__.ilus"
              echo "  ${LIB}/__init__.py"
              exit 1
            fi

            echo "  FOUND: $FOUND"

          done < "$IMPORT_FILE"

          rm -f "$IMPORT_FILE"

          echo
          echo "All Ilus imports resolved."


      # =========================================================
      # 9. Əgər əsas .ilus faylı subdirectory-dədirsə,
      #    onu build root-a gətir
      #
      # APK runtime üçün əsas proqramı:
      #
      #     main.ilus
      #
      # kimi saxlayırıq.
      # =========================================================
      - name: Prepare Ilus entry file
        working-directory: build_project
        shell: bash
        run: |
          set -e

          cp "$ILUS_FILE" main.ilus

          echo "Runtime Ilus entry:"
          echo "main.ilus"

          echo
          echo "=== main.ilus ==="
          cat main.ilus


      # =========================================================
      # 10. main.py yoxlanışı
      #
      # Bu sənin Ilus interpreter-indir.
      # =========================================================
      - name: Check Ilus interpreter
        working-directory: build_project
        shell: bash
        run: |
          set -e

          if [ ! -f "main.py" ]; then
            echo "::error::Ilus interpreter main.py was not found."
            exit 1
          fi

          echo "Ilus interpreter found:"
          ls -lh main.py


      # =========================================================
      # 11. PySide6 Android deployment spec yarat
      # =========================================================
      - name: Create deployment spec
        working-directory: build_project
        shell: bash
        run: |
          set -e

          cat > pysidedeploy.spec <<EOF
[app]
title = Ilus
input_file = main.py
output_dir = deployment
android_deployment_target = 34
EOF

          echo "=== pysidedeploy.spec ==="
          cat pysidedeploy.spec


      # =========================================================
      # 12. PySide6 Android deployment
      #
      # Qt-nin öz deployment tool-u istifadə olunur.
      # =========================================================
      - name: Build Android application
        working-directory: build_project
        shell: bash
        run: |
          set -e

          echo "Starting PySide6 Android deployment..."

          pyside6-android-deploy \
            --name Ilus \
            --input main.py


      # =========================================================
      # 13. APK-ni tap
      # =========================================================
      - name: Find APK
        working-directory: build_project
        shell: bash
        run: |
          set -e

          echo
          echo "========================================"
          echo "Searching for generated APK"
          echo "========================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo
            echo "::error::APK was not generated."
            exit 1
          fi

          echo
          echo "APK:"
          echo "$APK"

          mkdir -p ../artifacts

          cp "$APK" ../artifacts/Ilus.apk


      # =========================================================
      # 14. APK-ni GitHub Actions artifact kimi saxla
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: artifacts/Ilus.apk
          if-no-files-found: error
