name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Repository
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------------
      # 3. Linux dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            autoconf \
            automake \
            libtool \
            unzip \
            zip


      # --------------------------------------------------
      # 4. Find Ilus interpreter
      # --------------------------------------------------
      - name: Find main.py
        shell: bash
        run: |
          set -e

          MAIN_PY=$(find . \
            -type f \
            -name "main.py" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$MAIN_PY" ]; then
            echo "ERROR: main.py not found"
            exit 1
          fi

          echo "MAIN_PY=$MAIN_PY" >> "$GITHUB_ENV"

          echo "Found interpreter:"
          echo "$MAIN_PY"


      # --------------------------------------------------
      # 5. Find Ilus application
      # --------------------------------------------------
      - name: Find Ilus file
        shell: bash
        run: |
          set -e

          ILUS_FILE=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ILUS_FILE" ]; then
            echo "ERROR: No .ilus file found"
            exit 1
          fi

          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"

          echo "Found Ilus program:"
          echo "$ILUS_FILE"


      # --------------------------------------------------
      # 6. Create deployment project
      # --------------------------------------------------
      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir build_project

          cp "$MAIN_PY" build_project/main.py
          cp "$ILUS_FILE" build_project/

          echo "=== Project ==="
          find build_project -maxdepth 1 -type f -print


      # --------------------------------------------------
      # 7. Copy Ilus imports
      #
      # import foo
      #
      # -> foo.py
      # OR
      # -> foo.ilus
      # --------------------------------------------------
      - name: Collect Ilus libraries
        shell: bash
        run: |
          set -e

          echo "=== Reading imports ==="

          while IFS= read -r line; do

            if echo "$line" | grep -Eq \
              '^[[:space:]]*import[[:space:]]+[A-Za-z_][A-Za-z0-9_]*[[:space:]]*$'
            then

              MODULE=$(echo "$line" | sed -E \
                's/^[[:space:]]*import[[:space:]]+([A-Za-z_][A-Za-z0-9_]*).*$/\1/')

              echo "Import: $MODULE"

              FILE=""

              if [ -f "$MODULE.py" ]; then
                FILE="$MODULE.py"

              elif [ -f "$MODULE.ilus" ]; then
                FILE="$MODULE.ilus"

              else
                FILE=$(find . \
                  -type f \
                  \( -name "$MODULE.py" -o -name "$MODULE.ilus" \) \
                  -not -path "./.git/*" \
                  | head -n 1)
              fi

              if [ -z "$FILE" ]; then
                echo "WARNING: Library '$MODULE' not found"
              else
                echo "Copying $FILE"
                cp "$FILE" build_project/
              fi

            fi

          done < "$ILUS_FILE"

          echo
          echo "=== Final project ==="

          find build_project -maxdepth 1 -type f -print


      # --------------------------------------------------
      # 8. Install deployment tool
      # --------------------------------------------------
      - name: Install PySide6 deployment tool
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2.1"

          python -m pip install \
            GitPython \
            packaging \
            buildozer \
            jinja2 \
            pkginfo


      # --------------------------------------------------
      # 9. Get Qt Android deployment helper
      # --------------------------------------------------
      - name: Prepare Qt Android tools
        shell: bash
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup.git

          python -m pip install \
            -r pyside-setup/requirements.txt

          python -m pip install \
            -r pyside-setup/tools/cross_compile_android/requirements.txt


      # --------------------------------------------------
      # 10. Download Android SDK + NDK
      # --------------------------------------------------
      - name: Download Android SDK and NDK
        shell: bash
        run: |
          set -e

          python \
            pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license


      # --------------------------------------------------
      # 11. Download REAL Android wheels
      #
      # NO qtpip.
      #
      # We download the exact Qt 6.8.2.1 Android wheels
      # directly from Qt's snapshot server.
      # --------------------------------------------------
      - name: Download PySide6 Android wheels
        shell: bash
        run: |
          set -e

          mkdir -p android_wheels

          BASE="https://download.qt.io/snapshots/ci/pyside/6.8.2/latest/pyside6"

          PYSIDE_URL="$BASE/PySide6-6.8.2.1-cp39-abi3-android_aarch64.whl"
          SHIBOKEN_URL="$BASE/shiboken6-6.8.2.1-6.8.2-cp311-cp311-android_aarch64.whl"

          echo "Downloading PySide6 Android wheel..."

          curl -fL \
            "$PYSIDE_URL" \
            -o android_wheels/PySide6-android-aarch64.whl

          echo "Downloading Shiboken6 Android wheel..."

          curl -fL \
            "$SHIBOKEN_URL" \
            -o android_wheels/shiboken6-android-aarch64.whl

          echo
          echo "=== Android wheels ==="

          ls -lh android_wheels/


      # --------------------------------------------------
      # 12. Verify wheels
      # --------------------------------------------------
      - name: Verify Android wheels
        shell: bash
        run: |
          set -e

          test -f \
            android_wheels/PySide6-android-aarch64.whl

          test -f \
            android_wheels/shiboken6-android-aarch64.whl

          echo "PySide6 wheel:"
          ls -lh android_wheels/PySide6-android-aarch64.whl

          echo "Shiboken6 wheel:"
          ls -lh android_wheels/shiboken6-android-aarch64.whl


      # --------------------------------------------------
      # 13. Find SDK / NDK
      # --------------------------------------------------
      - name: Locate Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/.pyside6_android_deploy/android-sdk"
          NDK="$HOME/.pyside6_android_deploy/android-ndk/android-ndk-r27c"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found:"
            echo "$SDK"
            exit 1
          fi

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK not found:"
            echo "$NDK"
            exit 1
          fi

          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"

          echo "SDK:"
          echo "$SDK"

          echo "NDK:"
          echo "$NDK"


      # --------------------------------------------------
      # 14. Initialize PySide deployment spec
      # --------------------------------------------------
      - name: Initialize PySide Android deployment
        shell: bash
        run: |
          set -e

          cd build_project

          pyside6-android-deploy \
            --init \
            --name "Ilus" \
            --wheel-pyside="$GITHUB_WORKSPACE/android_wheels/PySide6-android-aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android_wheels/shiboken6-android-aarch64.whl" \
            --sdk-path="$ANDROID_SDK" \
            --ndk-path="$ANDROID_NDK"

          echo
          echo "=== Generated spec ==="

          cat pysidedeploy.spec


      # --------------------------------------------------
      # 15. Build APK
      # --------------------------------------------------
      - name: Build APK
        shell: bash
        run: |
          set -e

          cd build_project

          pyside6-android-deploy \
            --config-file pysidedeploy.spec \
            --wheel-pyside="$GITHUB_WORKSPACE/android_wheels/PySide6-android-aarch64.whl" \
            --wheel-shiboken="$GITHUB_WORKSPACE/android_wheels/shiboken6-android-aarch64.whl" \
            --sdk-path="$ANDROID_SDK" \
            --ndk-path="$ANDROID_NDK" \
            --force \
            --keep-deployment-files \
            --verbose


      # --------------------------------------------------
      # 16. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=== Searching for APK ==="

          APK=$(find build_project \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo
            echo "=== Build directory ==="

            find build_project \
              -maxdepth 5 \
              -type f \
              | head -n 200

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Ilus.apk"


      # --------------------------------------------------
      # 17. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: Ilus.apk
