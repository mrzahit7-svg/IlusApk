name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Repository-ni runner-ə gətir
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # 3. Repository-də nə olduğunu göstər
      - name: Show repository
        run: |
          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | sort


      # 4. main.py-ni tap
      - name: Find main.py
        shell: bash
        run: |
          set -e

          MAIN=$(find . -type f -name "main.py" | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.py was not found in repository!"
            exit 1
          fi

          echo "Found: $MAIN"
          echo "MAIN_PY=$MAIN" >> "$GITHUB_ENV"


      # 5. .ilus proqramını tap
      - name: Find Ilus program
        shell: bash
        run: |
          set -e

          FILES=$(find . -type f -name "*.ilus")

          COUNT=$(echo "$FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .ilus file found!"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            echo "$FILES"
            echo ""
            echo "Keep only the main .ilus program."
            exit 1
          fi

          ILUS_FILE=$(echo "$FILES" | head -n 1)

          echo "Found Ilus program: $ILUS_FILE"
          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"


      # 6. APK üçün ayrıca project qovluğu yarat
      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          cp "$MAIN_PY" build_project/main.py
          cp "$ILUS_FILE" build_project/

          echo "=== Build project ==="
          find build_project -maxdepth 2 -type f -print


      # 7. Ilus importlarını tap və kitabxanaları əlavə et
      - name: Collect Ilus imports
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          project = Path("build_project")

          main_file = project / "${{ env.ILUS_FILE }}"

          # Əgər ILUS_FILE alt qovluqdadırsa,
          # yalnız fayl adını götürürük.
          main_file = project / Path(main_file).name

          print("Reading:", main_file)

          text = main_file.read_text(encoding="utf-8")

          pattern = re.compile(
              r'^\s*import\s+([A-Za-z_][A-Za-z0-9_]*)\s*$',
              re.MULTILINE
          )

          imports = pattern.findall(text)

          print("=== Imports ===")

          if not imports:
              print("No imports found.")

          for name in imports:

              py_file = Path(name + ".py")
              ilus_file = Path(name + ".ilus")

              if py_file.exists():
                  shutil.copy2(
                      py_file,
                      project / py_file.name
                  )
                  print("Included:", py_file.name)

              elif ilus_file.exists():
                  shutil.copy2(
                      ilus_file,
                      project / ilus_file.name
                  )
                  print("Included:", ilus_file.name)

              else:
                  raise SystemExit(
                      f"ERROR: import '{name}' found, "
                      f"but {name}.py or {name}.ilus was not found!"
                  )


      # 8. PySide6
      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.8.2.1"


      # 9. Android deployment üçün lazımi alətlər
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            wget \
            unzip \
            openjdk-17-jdk \
            build-essential


      # 10. Android build mühitini hazırla
      - name: Prepare Android environment
        run: |
          git clone --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup.git

          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license


      # 11. Android PySide6 wheel-lərini götür
      - name: Download Android wheels
        working-directory: build_project
        run: |
          set -e

          mkdir -p wheels

          qtpip download PySide6 \
            --android \
            --arch aarch64 \
            --dest wheels

          echo "=== Wheels ==="
          find wheels -type f -maxdepth 2 -print


      # 12. Wheel-ləri tap
      - name: Find wheels
        working-directory: build_project
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL=$(find wheels \
            -type f \
            -name "PySide6-*.whl" \
            | head -n 1)

          SHIBOKEN_WHEEL=$(find wheels \
            -type f \
            -name "shiboken6-*.whl" \
            | head -n 1)

          if [ -z "$PYSIDE_WHEEL" ]; then
            echo "ERROR: PySide6 Android wheel not found!"
            exit 1
          fi

          if [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: shiboken6 Android wheel not found!"
            exit 1
          fi

          echo "PySide6:"
          echo "$PYSIDE_WHEEL"

          echo "Shiboken6:"
          echo "$SHIBOKEN_WHEEL"

          echo "PYSIDE_WHEEL=$PWD/$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$PWD/$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"


      # 13. APK build
      - name: Build APK
        working-directory: build_project
        run: |
          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --arch aarch64 \
            --force


      # 14. APK-ni tap
      - name: Find APK
        shell: bash
        run: |
          echo "=== APK files ==="
          find build_project \
            -type f \
            -name "*.apk" \
            -print


      # 15. APK-ni GitHub Actions-dan götürmək üçün artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: |
            build_project/**/*.apk
            build_project/*.apk
          if-no-files-found: error
