name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show project files
        run: |
          echo "=== Project files ==="
          find . -maxdepth 2 -type f | sort

      - name: Find Ilus program
        shell: bash
        run: |
          set -e

          FILES=$(find . -maxdepth 1 -type f -name "*.ilus" -printf "%f\n")

          COUNT=$(echo "$FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .ilus program found in repository root!"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            echo "$FILES"
            echo ""
            echo "Please keep only one main .ilus program in the repository root."
            exit 1
          fi

          ILUS_FILE=$(echo "$FILES" | head -n 1)

          echo "Found Ilus program: $ILUS_FILE"
          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"

      - name: Prepare Ilus project
        shell: bash
        run: |
          set -e

          mkdir -p build_project

          # Ilus interpreter
          cp main.py build_project/main.py

          # Main Ilus program
          cp "$ILUS_FILE" build_project/

          echo "Main program:"
          echo "$ILUS_FILE"

      - name: Collect Ilus imports
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          project = Path("build_project")
          ilus_file = project / "${{ env.ILUS_FILE }}"

          text = ilus_file.read_text(encoding="utf-8")

          pattern = re.compile(
              r'^\s*import\s+([A-Za-z_][A-Za-z0-9_]*)\s*$',
              re.MULTILINE
          )

          imports = pattern.findall(text)

          print("Detected imports:")
          print(imports)

          for name in imports:
              py_file = Path(name + ".py")
              ilus_lib = Path(name + ".ilus")

              if py_file.exists():
                  shutil.copy2(py_file, project / py_file.name)
                  print(f"Included: {py_file.name}")

              elif ilus_lib.exists():
                  shutil.copy2(ilus_lib, project / ilus_lib.name)
                  print(f"Included: {ilus_lib.name}")

              else:
                  raise SystemExit(
                      f"ERROR: import '{name}' found, "
                      f"but neither {name}.py nor {name}.ilus exists!"
                  )

      - name: Install PySide6
        run: |
          python -m pip install --upgrade pip
          pip install "PySide6==6.8.2.1"

      - name: Install Android deployment tool
        run: |
          pip install "PySide6==6.8.2.1"
          python -m pip install buildozer
          python -m pip install pyside6-android-deploy

      - name: Download Android SDK and NDK
        run: |
          git clone --depth 1 --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup.git

          python pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Download PySide6 Android wheels
        working-directory: build_project
        run: |
          mkdir -p wheels

          qtpip download PySide6 \
            --android \
            --arch aarch64 \
            --dest wheels

          echo "=== Downloaded wheels ==="
          ls -lh wheels

      - name: Find Android wheels
        working-directory: build_project
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL=$(find wheels -type f \
            -name "PySide6-*.whl" | head -n 1)

          SHIBOKEN_WHEEL=$(find wheels -type f \
            -name "shiboken6-*.whl" | head -n 1)

          if [ -z "$PYSIDE_WHEEL" ]; then
            echo "ERROR: PySide6 Android wheel not found!"
            exit 1
          fi

          if [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Shiboken6 Android wheel not found!"
            exit 1
          fi

          echo "PySide6 wheel:"
          echo "$PYSIDE_WHEEL"

          echo "Shiboken6 wheel:"
          echo "$SHIBOKEN_WHEEL"

          echo "PYSIDE_WHEEL=$PWD/$PYSIDE_WHEEL" >> "$GITHUB_ENV"
          echo "SHIBOKEN_WHEEL=$PWD/$SHIBOKEN_WHEEL" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: build_project
        run: |
          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside "$PYSIDE_WHEEL" \
            --wheel-shiboken "$SHIBOKEN_WHEEL" \
            --arch aarch64 \
            --force

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK files ==="
          find build_project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: |
            build_project/**/*.apk
            build_project/*.apk
          if-no-files-found: error
