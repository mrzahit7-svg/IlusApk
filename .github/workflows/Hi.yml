      - name: Inspect PySide6 and qtpip
        shell: bash
        run: |
          set -e

          echo "=== Python ==="
          python --version
          which python

          echo
          echo "=== PySide6 location ==="
          python -m pip show PySide6 || true

          echo
          echo "=== Python bin ==="
          find "$pythonLocation" \
            -maxdepth 4 \
            -type f \
            \( -iname "*qtpip*" -o -iname "*android*deploy*" \) \
            2>/dev/null \
            | head -n 100

          echo
          echo "=== site-packages qtpip search ==="
          python - <<'PY'
          import sys
          import os

          print("Python:", sys.executable)

          for p in sys.path:
              if os.path.isdir(p):
                  print("SEARCH:", p)
                  for root, dirs, files in os.walk(p):
                      for f in files:
                          if "qtpip" in f.lower():
                              print("FOUND:", os.path.join(root, f))
          PY
