name: Build Ilus APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. System dependencies
      # ==========================================

      - name: Install system dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            unzip \
            openjdk-17-jdk \
            build-essential


      # ==========================================
      # 4. Find main.py
      # ==========================================

      - name: Find main.py
        shell: bash
        run: |
          set -e

          MAIN=$(find . \
            -type f \
            -name "main.py" \
            -not -path "./pyside-setup/*" \
            | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: main.py was not found!"
            exit 1
          fi

          echo "Found main.py:"
          echo "$MAIN"

          echo "MAIN_PY=$MAIN" >> "$GITHUB_ENV"


      # ==========================================
      # 5. Find main .ilus program
      # ==========================================

      - name: Find Ilus program
        shell: bash
        run: |
          set -e

          FILES=$(find . \
            -type f \
            -name "*.ilus" \
            -not -path "./pyside-setup/*")

          COUNT=$(echo "$FILES" | sed '/^$/d' | wc -l)

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No .ilus file found!"
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: More than one .ilus file found:"
            echo "$FILES"
            exit 1
          fi

          ILUS_FILE=$(echo "$FILES" | head -n 1)

          echo "Found Ilus program:"
          echo "$ILUS_FILE"

          echo "ILUS_FILE=$ILUS_FILE" >> "$GITHUB_ENV"


      # ==========================================
      # 6. Prepare project
      # ==========================================

      - name: Prepare Ilus project
        shell: bash
        run: |
          set -e

          rm -rf build_project
          mkdir -p build_project

          cp "$MAIN_PY" build_project/main.py

          cp "$ILUS_FILE" \
            "build_project/$(basename "$ILUS_FILE")"

          echo "=== Build project ==="
          find build_project \
            -maxdepth 2 \
            -type f \
            -print


      # ==========================================
      # 7. Collect Ilus imports
      # ==========================================

      - name: Collect Ilus imports
        shell: python
        run: |
          from pathlib import Path
          import re
          import shutil

          project = Path("build_project")

          main_file = project / Path(
              "${{ env.ILUS_FILE }}"
          ).name

          if not main_file.exists():
              raise SystemExit(
                  f"ERROR: Ilus program not found: {main_file}"
              )

          print("Reading:")
          print(main_file)

          text = main_file.read_text(
              encoding="utf-8"
          )

          pattern = re.compile(
              r'^\s*import\s+'
              r'([A-Za-z_][A-Za-z0-9_]*)'
              r'\s*$',
              re.MULTILINE
          )

          imports = pattern.findall(text)

          print()
          print("=== Ilus imports ===")

          if not imports:
              print("No imports found.")

          for name in imports:

              py_file = Path(name + ".py")
              ilus_file = Path(name + ".ilus")

              if py_file.exists():

                  shutil.copy2(
                      py_file,
                      project / py_file.name
                  )

                  print(
                      f"Included: {py_file.name}"
                  )

              elif ilus_file.exists():

                  shutil.copy2(
                      ilus_file,
                      project / ilus_file.name
                  )

                  print(
                      f"Included: {ilus_file.name}"
                  )

              else:

                  raise SystemExit(
                      f"ERROR: import '{name}' found, "
                      f"but neither "
                      f"{name}.py nor "
                      f"{name}.ilus exists!"
                  )


      # ==========================================
      # 8. Install PySide6
      # ==========================================

      - name: Install PySide6
        run: |
          set -e

          python -m pip install --upgrade pip

          python -m pip install \
            "PySide6==6.8.2.1"


      # ==========================================
      # 9. Clone PySide setup
      # ==========================================

      - name: Clone PySide setup
        run: |
          set -e

          git clone \
            --depth 1 \
            --branch 6.8 \
            https://code.qt.io/pyside/pyside-setup.git


      # ==========================================
      # 10. Install Qt deployment requirements
      # ==========================================

      - name: Install Qt deployment requirements
        run: |
          set -e

          python -m pip install \
            -r pyside-setup/requirements.txt

          python -m pip install \
            -r pyside-setup/tools/cross_compile_android/requirements.txt


      # ==========================================
      # 11. Prepare Android SDK + NDK
      # ==========================================

      - name: Download Android SDK and NDK
        run: |
          set -e

          python \
            pyside-setup/tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license


      # ==========================================
      # 12. Locate qtpip
      # ==========================================

      - name: Locate qtpip
        shell: bash
        run: |
          set -e

          echo "=== Searching for qtpip ==="

          QTPIP=$(find \
            /opt/hostedtoolcache/Python/3.11.16/x64 \
            -type f \
            -name "qtpip" \
            2>/dev/null \
            | head -n 1)

          if [ -z "$QTPIP" ]; then
            echo "ERROR: qtpip executable was not found."

            echo
            echo "=== PySide6 scripts ==="

            find \
              /opt/hostedtoolcache/Python/3.11.16/x64 \
              -type f \
              -iname "*qtpip*" \
              2>/dev/null \
              | head -n 20

            exit 1
          fi

          echo "Found qtpip:"
          echo "$QTPIP"

          chmod +x "$QTPIP"

          echo "QTPIP=$QTPIP" >> "$GITHUB_ENV"


      # ==========================================
      # 13. Download Android PySide6 wheels
      # ==========================================

      - name: Download Android PySide6 wheels
        working-directory: build_project
        run: |
          set -e

          mkdir -p wheels

          "$QTPIP" download \
            PySide6 \
            --android \
            --arch aarch64 \
            --dest wheels

          echo
          echo "=== Android wheels ==="

          find wheels \
            -type f \
            -print


      # ==========================================
      # 14. Find Android wheels
      # ==========================================

      - name: Find Android wheels
        working-directory: build_project
        shell: bash
        run: |
          set -e

          PYSIDE_WHEEL=$(find wheels \
            -type f \
            -name "PySide6-*.whl" \
            | head -n 1)

          SHIBOKEN_WHEEL=$(find wheels \
            -type f \
            -name "shiboken6-*.whl" \
            | head -n 1)

          if [ -z "$PYSIDE_WHEEL" ]; then
            echo "ERROR: PySide6 Android wheel not found!"
            exit 1
          fi

          if [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "ERROR: Shiboken6 Android wheel not found!"
            exit 1
          fi

          echo
          echo "PySide6 wheel:"
          echo "$PYSIDE_WHEEL"

          echo
          echo "Shiboken6 wheel:"
          echo "$SHIBOKEN_WHEEL"

          echo \
            "PYSIDE_WHEEL=$PWD/$PYSIDE_WHEEL" \
            >> "$GITHUB_ENV"

          echo \
            "SHIBOKEN_WHEEL=$PWD/$SHIBOKEN_WHEEL" \
            >> "$GITHUB_ENV"


      # ==========================================
      # 15. Build APK
      # ==========================================

      - name: Build APK
        working-directory: build_project
        run: |
          set -e

          pyside6-android-deploy \
            --name "Ilus" \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --force \
            --verbose


      # ==========================================
      # 16. Find APK
      # ==========================================

      - name: Find APK
        shell: bash
        run: |
          echo "=== APK files ==="

          find build_project \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 17. Upload APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ilus-APK
          path: |
            build_project/**/*.apk
            build_project/*.apk
          if-no-files-found: error
